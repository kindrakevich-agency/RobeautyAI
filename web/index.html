    />

    <meta name="theme-color" content="#F2F2F0" media="(prefers-color-scheme: light)" />

      content="AI-консультант RoBeauty — підбір догляду за каталогом бренду"

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "RoBeauty AI",
        "url": "https://robeauty.kindrakevich.com/",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "inLanguage": ["uk", "pl"],
        "description": "AI-консультант поверх каталогу RoBeauty: підбір догляду за типом шкіри й проблемою, картки товарів із цінами й складом, передача менеджеру.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "UAH" },
        "author": {
          "@type": "Organization",
          "name": "kindrakevich.com",
          "url": "https://kindrakevich.com"
        }
      }
    </script>

    <script>
      // Дефолт — темна тема; читаємо вибір до першого кадру, щоб не блимало світлим.
      try {
        var t = localStorage.getItem('rb-theme') || 'dark'
        if (t === 'dark') document.documentElement.classList.add('dark')
      } catch (e) {}
      // Адмінка не має потрапляти в індекс: тут один index.html на всі
      // маршрути, тож ставимо noindex ще до рендера. На рівні nginx той
      // самий заборон дублюється заголовком X-Robots-Tag.
      if (location.pathname.indexOf('/admin') === 0) {
        var m = document.createElement('meta')
        m.name = 'robots'
        m.content = 'noindex, nofollow'
        document.head.appendChild(m)
      }
    </script>
  </head>
  <body class="bg-[#191A1B]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
